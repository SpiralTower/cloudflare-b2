name = "cloudflare-b2"

workers_dev = true
compatibility_date = "2023-09-04"

main = "index.js"

# Don't put your application key in this file!
# You should set it as a secret in the Cloudflare dashboard or at the command line:
# echo "<your b2 application key>" | wrangler secret put B2_APPLICATION_KEY
[vars]
B2_APPLICATION_KEY_ID = "<your b2 application key id>"
B2_ENDPOINT = "<your endpoint - e.g. s3.us-west-001.backblazeb2.com>"
# Set BUCKET_NAME to:
#   "A Backblaze B2 bucket name" - direct all requests to the specified bucket
#   "$path" - use the initial segment in the incoming URL path as the bucket name
#           e.g. https://images.example.com/bucket-name/path/to/object.png
#   "$host" - use the initial subdomain in the hostname as the bucket name
#           e.g. https://bucket-name.images.example.com/path/to/object.png
BUCKET_NAME = "<your bucket name, $path, or $host>"
# Bucket listing is denied unless explicitly enabled.
ALLOW_LIST_BUCKET = "false"
# Anonymous GET and HEAD requests are denied unless explicitly enabled.
# Range requests are included. Anonymous writes are always denied.
ALLOW_UNSIGNED_READ = "false"
# Allowed clock difference for Authorization-header signatures, in seconds.
# Valid values are 0 through 86400. Invalid values fall back to 900.
SIGNATURE_MAX_SKEW_SECONDS = "900"
# If set, the worker will strip the `file/` prefix from incoming request paths.
# See https://rclone.org/b2/#b2-download-url
RCLONE_DOWNLOAD = "false"
# If ALLOWED_HEADERS is set, only these client headers are forwarded upstream.
# Authentication headers, host, body framing, hop-by-hop headers, Cloudflare
# headers, and the headers listed in the README are always filtered.
# Header names are case-insensitive.
#ALLOWED_HEADERS = [
#    "content-type",
#    "if-match",
#    "if-modified-since",
#    "if-none-match",
#    "if-unmodified-since",
#    "range",
#    "x-amz-server-side-encryption-customer-algorithm",
#    "x-amz-server-side-encryption-customer-key",
#    "x-amz-server-side-encryption-customer-key-md5"
#]
